[project]
name = "retrieval-ablation"
version = "0.1.0"
description = "A labelled retrieval benchmark and single-axis ablation study over SEC filings"
readme = "README.md"
requires-python = ">=3.12"

# Core: exactly what corpus parsing, chunking, retrieval and evaluation import,
# and nothing else. Kept deliberately small because this set is installed into
# borrowed environments -- a Kaggle GPU session, CI -- where every extra package
# is a chance to collide with something preinstalled.
#
# numpy and scipy floors are as low as the code actually needs, not as high as
# the development machine happens to have. A floor of numpy>=2.1 would force pip
# to upgrade numpy inside a Kaggle session, and the preinstalled torch there is
# compiled against whatever numpy shipped with the image -- upgrading it breaks
# torch's ABI and the failure surfaces far from its cause. The code uses only
# `default_rng`, `quantile`, `argpartition` and friends, all present since 1.17.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "lxml>=5.0",
    # Never imported anywhere in src/, and it must stay anyway. pydantic-settings
    # declares python-dotenv as an *extra*, and reaches for it internally to
    # honour `env_file`. Without it installed, `.env` loading does not fail --
    # it silently does nothing, every API key reads as None, and the failure
    # surfaces much later as an unrelated authentication error. Do not remove it
    # because a dependency audit reports it as unused.
    "python-dotenv>=1.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
# Kept out of the default install so CI stays offline, fast, and CPU-only.
# Nothing in `tests/` may import from this group.
gpu = [
    "torch>=2.9",
    "sentence-transformers>=3.3",
    "transformers>=4.46",
]
# Serving the demo API. Split out because none of it is imported by the corpus,
# retrieval or evaluation code, and installing it on a GPU worker pulls grpcio,
# protobuf, uvloop and websockets purely to sit unused -- protobuf in particular
# is a frequent source of conflicts with preinstalled TensorFlow.
service = [
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_ablation"]

# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
    "ARG",      # unused arguments
    "PL",       # pylint subset
    "NPY",      # numpy legacy random / API
]
ignore = [
    "PLR0913",  # many arguments: ablation config objects legitimately have many
    "PLR2004",  # magic values: metric tests are clearer with literals inline
]

# Em dash and en dash are not accidental lookalikes here: the corpus is SEC
# filings, which use both for numeric ranges and heading separators, and the
# parser exists in part to handle them. Declaring them allowed is more honest
# than sprinkling per-line suppressions over the code that does that work.
allowed-confusables = ["–", "—"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "SLF001", "PLR0917", "ARG005", "PLC0415"]

# Function-level imports here are the design, not an oversight. torch and
# sentence-transformers are optional dependencies behind the `gpu` extra; if these
# modules imported them at top level, merely importing the package would require a
# multi-gigabyte install and the offline test suite could not run at all. The
# import is deferred to the point where a real model is actually being loaded.
"src/retrieval_ablation/embed/local.py" = ["PLC0415"]
"src/retrieval_ablation/index/rerank.py" = ["PLC0415"]

# The Kaggle worker clones and pip-installs this repo at runtime, so its imports
# cannot be resolved at module import time -- they must happen after the install
# step inside main(). It is a standalone script pasted into a notebook cell, not
# a library module.
"notebooks/*.py" = ["PLC0415", "I001", "E402"]

# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "gpu: requires a local GPU and downloaded model weights (deselected in CI)",
    "live: performs a real network call to a third-party API (deselected in CI)",
]
# Fail the run if a test emits an unraisable warning, which is how a leaked
# network client or unawaited coroutine usually shows up.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
